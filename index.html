<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d0f12"><title>Cycle Tracker — Densité</title>
<style>
:root{--bg:#0d0f12;--card:#171a1f;--card2:#20242b;--text:#f2f4f7;--muted:#9da5b1;--line:#303641;--accent:#d8ff45;--danger:#ff6678;--blue:#8fc8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:780px;margin:auto;padding:16px 13px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:23px;margin:0}.sub,.muted{color:var(--muted)}.sub{font-size:12px;margin-top:4px}.nav{display:flex;gap:5px;background:var(--card);padding:5px;border-radius:13px;margin-bottom:15px}.nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 3px;border-radius:9px;font-size:13px}.nav button.active{background:var(--card2);color:var(--text)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{font-size:10px;color:#111;background:var(--accent);padding:5px 7px;border-radius:7px;font-weight:800;white-space:nowrap}.tag.blue{background:var(--blue)}h2{font-size:17px;margin:4px 0}.small{font-size:12px}.tiny{font-size:11px}.week{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.week button,.sessionTabs button,.secondary{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:10px 7px}.week button.active{border-color:var(--accent);color:var(--text);background:#1c2115}.sessionTabs{display:flex;gap:7px;margin-bottom:12px}.sessionTabs button{flex:1;font-weight:700}.sessionTabs button.active{background:var(--accent);color:#111;border-color:var(--accent)}.exercise{padding:13px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.exercise h3{margin:0;font-size:15px}.prescription{font-size:12px;color:var(--muted);margin:5px 0 8px;line-height:1.4}.swap{font-size:12px;line-height:1.4;color:var(--blue);margin:7px 0}.sets{display:grid;grid-template-columns:24px 1fr 1fr 1fr 34px;gap:5px;align-items:center}.sets .head{font-size:9px;color:var(--muted);text-align:center}.sets input{min-width:0;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 2px;text-align:center;font-size:13px}.check{width:34px;height:35px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}.check.done{background:var(--accent);color:#111;border-color:var(--accent)}.notes{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px}.primary{width:100%;border:0;background:var(--accent);color:#111;font-weight:800;padding:13px;border-radius:11px;margin-top:9px}.secondary{color:var(--text);padding:9px 10px;font-size:12px}.bar{height:7px;background:var(--bg);border-radius:20px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}.historyItem{padding:10px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.5}.suggestion{border-left:3px solid var(--accent);padding:10px 11px;background:#1b2015;border-radius:0 9px 9px 0;margin-top:9px;font-size:13px;line-height:1.45}.warn{border-left:3px solid var(--danger);padding:9px 10px;background:#24181b;border-radius:0 8px 8px 0;font-size:12px;margin-top:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.selectrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}.selectrow select{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:9px;border-radius:9px;max-width:58%}.empty{text-align:center;padding:24px;color:var(--muted)}@media(max-width:420px){.app{padding:12px 9px 70px}.card{padding:11px}.sets{grid-template-columns:21px 1fr 1fr 1fr 31px;gap:4px}.check{width:31px}.sets input{font-size:12px}.nav button{font-size:12px}}
</style></head><body><div class="app"><header><div><h1>Cycle Tracker</h1><div class="sub">Densité · Athlétisation · Progression RIR</div></div><button class="secondary" onclick="resetCycle()">Réinitialiser</button></header>
<div class="nav"><button id="navWorkout" class="active" onclick="showPage('workout')">Séance</button><button id="navStats" onclick="showPage('stats')">Progression</button><button id="navHistory" onclick="showPage('history')">Historique / Export</button></div>
<main id="workoutPage"><div class="card"><div class="selectrow"><label for="gym">Lieu de séance</label><select id="gym" onchange="state.gym=this.value;save();renderWorkout()"><option value="basic">Basic-Fit</option><option value="caserne">Caserne / matériel limité</option></select></div><div class="muted tiny">Les variantes s’affichent automatiquement selon le lieu choisi. Les données sont conservées sur cet appareil/navigateur.</div></div><div class="week" id="week"></div><div class="sessionTabs" id="sessionTabs"></div><div id="workout"></div></main><main id="statsPage" style="display:none"></main><main id="historyPage" style="display:none"></main></div>
<script>
const PROGRAM={
A:{title:'A — Force, chaîne postérieure et abdos',exercises:[
{name:'Sauts sur box',sets:4,range:[3,3],rir:3,kind:'power',pres:'4 × 3 · explosivité / réception stable',swap:'Caserne : saut vertical sans box, 4 × 3. Poids du corps uniquement.'},
{name:'Soulevé de terre conventionnel',sets:4,range:[6,8],rir:2,kind:'load',pres:'4 × 6–8 · RIR 2',start:'125–130 kg indicatifs',swap:'Caserne : même mouvement si barre et disques disponibles. Sinon soulevé de terre kettlebell/haltères 4 × 8–10, RIR 2.'},
{name:'Bulgarian split squat',sets:3,range:[8,10],rir:2,kind:'load',pres:'3 × 8–10 / jambe · RIR 2',swap:'Caserne : fente arrière avec haltères ou sac chargé, 3 × 8–10 / jambe.'},
{name:'Ab wheel',sets:3,range:[10,12],rir:2,kind:'reps',pres:'3 × 10–12 · garder le bassin contrôlé',swap:'Caserne : ab wheel si disponible ; sinon dead bug contrôlé 3 × 10 / côté.'},
{name:'Gainage latéral',sets:3,range:[30,45],rir:2,kind:'time',pres:'3 × 30–45 s / côté',swap:'Caserne : identique. Progression par durée ou petite charge sur la hanche.'}
]},
B:{title:'B — Dos, épaules et biceps',exercises:[
{name:'Tractions pronation lestées',sets:4,range:[6,8],rir:2,kind:'load',pres:'4 × 6–8 · RIR 2',start:'+15 à +20 kg selon RIR du jour',swap:'Caserne : tractions strictes au poids du corps ou lestées selon matériel.'},
{name:'Rowing poitrine appuyée',sets:3,range:[8,12],rir:2,kind:'load',pres:'3 × 8–12 · RIR 2',swap:'Caserne : rowing unilatéral haltère 3 × 10–12 / côté, ou rowing barre si maîtrisé.'},
{name:'Élévations latérales à la poulie',sets:4,range:[12,20],rir:2,kind:'load',pres:'4 × 12–20 · RIR 2–3 · amplitude indolore',swap:'Caserne : élévations latérales haltères 4 × 12–20, strictes.'},
{name:'Oiseau / deltoïde postérieur',sets:3,range:[12,15],rir:2,kind:'load',pres:'3 × 12–15 · RIR 2–3',swap:'Caserne : oiseau haltères buste penché 3 × 12–15.'},
{name:'Curl biceps supination',sets:3,range:[8,12],rir:2,kind:'load',pres:'3 × 8–12 · RIR 2',swap:'Caserne : curl haltères alterné 3 × 8–12. Si l’épaule n’aime pas la position inclinée, bras près du corps.'},
{name:'Cuban press léger',sets:2,range:[12,15],rir:3,kind:'load',pres:'2 × 12–15 · RIR 3–4, technique et contrôle',swap:'Caserne : haltères très légers 2 × 12–15. Supprimer si douleur.'},
{name:'Développé haltères prise neutre (conditionnel)',sets:2,range:[12,15],rir:3,kind:'load',pres:'2 × 12–15 · RIR 3 · uniquement si indolore',swap:'Caserne : pompes sur poignées, amplitude confortable, 2 × 10–15 à RIR 3. Supprimer si douleur.'}
]},
C:{title:'C — Jambes, athlétisme et tronc',exercises:[
{name:'Saut en longueur + bond latéral',sets:3,range:[3,3],rir:3,kind:'power',pres:'3 × 3 sauts en longueur + 3 bonds latéraux / côté',swap:'Caserne : même exercice, au sol, espace dégagé. Arrêter si réception instable ou tendon douloureux.'},
{name:'Presse à cuisses',sets:4,range:[10,12],rir:2,kind:'load',pres:'4 × 10–12 · RIR 2',swap:'Caserne : squat tempo 3-3-1-0, 3 × 6–8 à RIR 2–3. Descente 3 s, pause basse 3 s, remontée contrôlée. Charge modérée.'},
{name:'Leg curl',sets:3,range:[10,15],rir:2,kind:'load',pres:'3 × 10–15 · RIR 2',swap:'Caserne : leg curl avec élastique si possible ; sinon RDL léger 3 × 8–10 seulement si récupération après A bonne.'},
{name:'Relevés de genoux chaise romaine',sets:3,range:[10,15],rir:2,kind:'reps',pres:'3 × 10–15 · enrouler le bassin en haut',swap:'Caserne : relevés de genoux suspendu si barre disponible ; sinon reverse crunch au sol 3 × 12–15.'},
{name:'Pallof press',sets:3,range:[10,12],rir:2,kind:'reps',pres:'3 × 10–12 / côté · anti-rotation',swap:'Caserne : gainage latéral 3 × 30–45 s / côté.'},
{name:'Farmer carry',sets:3,range:[30,40],rir:2,kind:'time',pres:'3 × 30–40 m · posture stable',swap:'Caserne : carry avec haltères, kettlebells ou charges disponibles. Si rien de sûr, supprimer.'}
]}}
const SUPERSETS=[{session:'B',groups:[[2,3]],label:'SUPERSET 1',note:'Élévations latérales + oiseau : alterner les deux exercices, puis récupérer 60–75 s.'},{session:'B',groups:[[5,6]],label:'SUPERSET 2 (facultatif)',note:'Cuban press + développé prise neutre : uniquement si l’épaule est indolore. Repos 60–90 s ; sinon faire le Cuban press seul et supprimer le développé.'},{session:'A',groups:[[3,4]],label:'SUPERSET 1',note:'Ab wheel + gainage latéral : alterner les exercices, puis récupérer 45–60 s.'},{session:'C',groups:[[3,4]],label:'SUPERSET 1',note:'Relevés de genoux + Pallof press : alterner les exercices, puis récupérer 45–60 s.'}];
const KEY='cycleTracker202610';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{week:1,session:'A',gym:'basic',logs:{},completed:{},started:new Date().toISOString()};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function k(w,s,i,j){return `${w}-${s}-${i}-${j}`}function log(i,j){return state.logs[k(state.week,state.session,i,j)]||{reps:'',weight:'',rir:'',done:false}}
function showPage(p){['workout','stats','history'].forEach(x=>document.getElementById(x+'Page').style.display=x===p?'block':'none');['navWorkout','navStats','navHistory'].forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById('nav'+p[0].toUpperCase()+p.slice(1)).classList.add('active');if(p==='stats')renderStats();if(p==='history')renderHistory()}
function render(){document.getElementById('gym').value=state.gym;document.getElementById('week').innerHTML=[1,2,3].map(w=>`<button class="${state.week===w?'active':''}" onclick="state.week=${w};save();render()">Semaine ${w}</button>`).join('');document.getElementById('sessionTabs').innerHTML=['A','B','C'].map(s=>`<button class="${state.session===s?'active':''}" onclick="state.session='${s}';save();render()">Séance ${s}</button>`).join('');renderWorkout()}
function update(i,j,f,v){let kk=k(state.week,state.session,i,j);state.logs[kk]={...(state.logs[kk]||{}),[f]:v};save()}
function toggle(i,j){let kk=k(state.week,state.session,i,j);state.logs[kk]={...(state.logs[kk]||{}),done:!((state.logs[kk]||{}).done)};save();renderWorkout()}
function exerciseSwap(e){return state.gym==='basic'?`Basic-Fit : ${e.name}.`:e.swap}
function renderWorkout(){let p=PROGRAM[state.session],done=0,total=0,body=`<div class="card"><span class="tag">SEMAINE ${state.week}</span><h2>${p.title}</h2><div class="muted small">Cible générale : garder 1–3 répétitions en réserve. Les sauts se notent en qualité, pas en RIR.</div><div class="bar"><div class="fill" id="fill" style="width:0%"></div></div></div>`;
p.exercises.forEach((e,i)=>{let sup=SUPERSETS.find(x=>x.session===state.session&&x.groups.some(g=>g.includes(i)));body+=`<div class="card exercise">${sup?`<div class="row"><span class="tag blue">${sup.label}</span><span class="tiny muted">À alterner avec l’exercice associé</span></div>`:''}<div class="row"><h3>${i+1}. ${e.name}</h3><span class="tag">${e.kind==='power'?'PUISSANCE':e.kind==='time'?'TEMPS / DISTANCE':'HYPERTROPHIE'}</span></div><div class="prescription">${e.pres}${e.start?`<br><b>Départ indicatif :</b> ${e.start}`:''}</div><div class="swap">${exerciseSwap(e)}</div><div class="sets"><div class="head">#</div><div class="head">REPS / S</div><div class="head">KG</div><div class="head">RIR</div><div></div>`;
for(let j=0;j<e.sets;j++){let l=log(i,j);total++;if(l.done)done++;body+=`<div class="head">${j+1}</div><input inputmode="decimal" aria-label="répétitions" value="${esc(l.reps)}" onchange="update(${i},${j},'reps',this.value)" placeholder="—"><input inputmode="decimal" aria-label="charge kg" value="${esc(l.weight)}" onchange="update(${i},${j},'weight',this.value)" placeholder="—"><input inputmode="decimal" aria-label="RIR" value="${esc(l.rir)}" onchange="update(${i},${j},'rir',this.value)" placeholder="—"><button class="check ${l.done?'done':''}" onclick="toggle(${i},${j})">${l.done?'✓':'○'}</button>`}body+=`</div><input class="notes" value="${esc((state.logs[k(state.week,state.session,i,0)]||{}).note||'')}" onchange="update(${i},0,'note',this.value)" placeholder="Note : douleur, sensation, adaptation…"></div>`;
let note=SUPERSETS.find(x=>x.session===state.session&&x.groups.some(g=>g.includes(i)&&g[0]===i));if(note)body+=`<div class="muted small" style="padding:0 4px 10px">${note.note}</div>`});body+=`<div class="card"><b>Fin de séance</b><div class="muted small">Renseigne les répétitions, la charge et le RIR de chaque série, puis valide. L’application proposera la progression pour la prochaine occurrence de cette séance.</div><button class="primary" onclick="finishSession()">✓ Terminer et calculer la progression</button><div id="finishResult"></div></div>`;document.getElementById('workout').innerHTML=body;document.getElementById('fill').style.width=(done/total*100)+'%';}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function previousLog(w,s,i){let best=null;for(let ww=w-1;ww>=1;ww--){let vals=PROGRAM[s].exercises[i],sets=[];for(let j=0;j<vals.sets;j++){let x=state.logs[k(ww,s,i,j)];if(x&&(x.reps!==''||x.weight!==''||x.rir!==''))sets.push(x)}if(sets.length){best={week:ww,sets};break}}return best}
function suggestion(e,i){let sets=[];for(let j=0;j<e.sets;j++){let x=state.logs[k(state.week,state.session,i,j)];if(x&&(x.reps!==''||x.weight!==''||x.rir!==''))sets.push(x)}if(!sets.length)return `${e.name} : aucune donnée complète. La prochaine fois, note les répétitions, la charge et le RIR pour obtenir une progression fiable.`;let reps=sets.filter(x=>x.reps!=='').map(x=>Number(x.reps)).filter(Number.isFinite),rirs=sets.map(x=>Number(x.rir)).filter(x=>x!==''&&Number.isFinite(Number(x))).map(Number),weights=sets.filter(x=>x.weight!=='').map(x=>Number(x.weight)).filter(Number.isFinite),avgRir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null,allTop=reps.length>=e.sets&&reps.every(v=>v>=e.range[1]),allSetsLogged=sets.length>=e.sets;let w=weights.length?Math.max(...weights):null;if(e.kind==='power'||e.kind==='time')return `${e.name} : conserver la dose prévue et chercher une meilleure qualité / stabilité. Pas d’augmentation automatique de charge.`;if(avgRir!==null&&avgRir<1)return `${e.name} : trop proche de l’échec (RIR moyen ${avgRir.toFixed(1)}). Réduis la charge de 2,5–5 % ou enlève 1–2 reps par série pour retrouver RIR ${e.rir}.`;if(allSetsLogged&&allTop&&avgRir!==null&&avgRir>=e.rir+1&&w!==null)return `${e.name} : haut de fourchette validé sur toutes les séries avec marge (RIR moyen ${avgRir.toFixed(1)}). Augmente la charge de 2–5 % la prochaine fois et repars au bas de la fourchette (${e.range[0]} reps).`;if(avgRir!==null&&avgRir>=e.rir&&reps.length&&reps.every(v=>v<e.range[1]))return `${e.name} : conserve la charge et ajoute 1 répétition par série la prochaine fois, sans dépasser ${e.range[1]}, tant que le RIR cible reste respecté.`;if(avgRir!==null&&avgRir>=e.rir)return `${e.name} : conserve la charge. Cherche progressivement ${e.range[0]}–${e.range[1]} reps au RIR ${e.rir}.`;return `${e.name} : données RIR ou séries incomplètes. Conserve la charge et complète les données la prochaine fois avant d’augmenter.`}
function finishSession(){let p=PROGRAM[state.session],suggestions=[];p.exercises.forEach((e,i)=>suggestions.push(suggestion(e,i)));state.completed[`${state.week}-${state.session}`]={date:new Date().toISOString(),suggestions};save();let box=document.getElementById('finishResult');box.innerHTML=`<div class="suggestion"><b>Progression proposée pour la prochaine séance ${state.session}</b><br>${suggestions.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br><br>')}</div><div class="muted tiny" style="margin-top:8px">Suggestion indicative : le RIR est estimé, pas mesuré. Si la technique se dégrade, douleur ou fatigue inhabituelle, ne progresse pas automatiquement.</div>`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderStats(){let sessions=Object.keys(state.completed).length,done=Object.values(state.logs).filter(x=>x.done).length;let html=`<div class="stats"><div class="stat"><b>${sessions}</b><span>séances terminées</span></div><div class="stat"><b>${done}</b><span>séries cochées</span></div><div class="stat"><b>S${state.week}</b><span>semaine active</span></div></div><div class="card" style="margin-top:12px"><h2>Progression suggérée</h2><div class="muted small">Les suggestions apparaissent après « Terminer la séance ». L’algorithme applique une double progression : d’abord les répétitions, puis une hausse de charge lorsque le haut de fourchette est validé avec une marge de RIR.</div></div>`;Object.entries(state.completed).reverse().forEach(([key,v])=>{html+=`<div class="card"><b>Séance ${key.split('-')[1]} · semaine ${key.split('-')[0]}</b><div class="muted tiny">${new Date(v.date).toLocaleString('fr-FR')}</div>${(v.suggestions||[]).map((x,i)=>`<div class="historyItem">${i+1}. ${esc(x)}</div>`).join('')}</div>`});document.getElementById('statsPage').innerHTML=html}
function exportData(){let payload={app:'Cycle Tracker',version:2,exportedAt:new Date().toISOString(),program:PROGRAM,state,legacyCycleTracker:JSON.parse(localStorage.getItem('cycleTracker')||'null')};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cycle-tracker-export-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}
function exportText(){let out=['CYCLE TRACKER — EXPORT POUR ANALYSE COACH','Export : '+new Date().toLocaleString('fr-FR'),'Cycle : 3 semaines','Lieu préféré : '+(state.gym==='basic'?'Basic-Fit':'Caserne')];for(let w=1;w<=3;w++)for(let s of ['A','B','C']){let used=false;out.push(`\n=== SEMAINE ${w} — SÉANCE ${s} ===`);PROGRAM[s].exercises.forEach((e,i)=>{let vals=[];for(let j=0;j<e.sets;j++){let l=state.logs[k(w,s,i,j)];if(l&&(l.reps||l.weight||l.rir||l.done)){used=true;vals.push(`S${j+1}: reps=${l.reps||'-'}, kg=${l.weight||'-'}, RIR=${l.rir||'-'}, validée=${l.done?'oui':'non'}`)}}if(vals.length)out.push(e.name+'\n  '+vals.join('\n  '));let c=state.completed[`${w}-${s}`];if(c&&c.suggestions&&c.suggestions[i])out.push('  Proposition: '+c.suggestions[i])});if(!used&&!state.completed[`${w}-${s}`])out.push('(aucune donnée saisie)')}let blob=new Blob([out.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cycle-tracker-pour-coach-'+new Date().toISOString().slice(0,10)+'.txt';a.click();URL.revokeObjectURL(url)}
function renderHistory(){let html=`<div class="card"><h2>Historique et export</h2><div class="muted small">Pour me transmettre ton cycle, exporte le fichier texte : il est compact et lisible directement dans la conversation. Le JSON conserve toutes les données structurées pour sauvegarde.</div><div class="actions"><button class="primary" onclick="exportText()">Exporter pour le coach (.txt)</button><button class="secondary" onclick="exportData()">Sauvegarde complète (.json)</button></div></div>`;let any=false;for(let w=1;w<=3;w++)for(let s of ['A','B','C']){let items=[];PROGRAM[s].exercises.forEach((e,i)=>{let vals=[];for(let j=0;j<e.sets;j++){let l=state.logs[k(w,s,i,j)];if(l&&(l.reps||l.weight||l.rir||l.done))vals.push(`S${j+1}: ${l.reps||'—'} reps · ${l.weight||'—'} kg · RIR ${l.rir||'—'} ${l.done?'✓':''}`)}if(vals.length)items.push(`<div class="historyItem"><b>${e.name}</b><br>${vals.map(esc).join('<br>')}</div>`)});if(items.length||state.completed[`${w}-${s}`]){any=true;html+=`<div class="card"><b>Semaine ${w} · Séance ${s}</b>${items.join('')}${state.completed[`${w}-${s}`]?'<div class="tag">Terminée</div>':''}</div>`}}if(!any)html+=`<div class="empty">Aucune séance enregistrée pour le nouveau cycle.</div>`;document.getElementById('historyPage').innerHTML=html}
function resetCycle(){if(confirm('Effacer uniquement les données de ce nouveau cycle ? L’ancien cycleTracker reste conservé.')){localStorage.removeItem(KEY);location.reload()}}
render();
</script></body></html>
